services:
  main:
    build:
      context: ${GENESIS_EDD_REPO}
      dockerfile: .genesis/edd/harness/environment/Dockerfile
    command: ["sleep", "infinity"]
    environment:
      REPORT_API_URL: http://api:8080
      NOTIFY_API_URL: http://api:8080
    volumes:
      - ledger:/evidence:ro
    depends_on:
      api:
        condition: service_healthy
  api:
    image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
    configs:
      - source: simulator
        target: /opt/simulator.py
    command: ["python", "/opt/simulator.py", "503"]
    volumes:
      - ledger:/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health', timeout=2).close()"]
      interval: 1s
      timeout: 3s
      retries: 20

configs:
  simulator:
    file: ${GENESIS_EDD_HARNESS}/environment/simulator.py
volumes:
  ledger:
networks:
  default:
    internal: true
